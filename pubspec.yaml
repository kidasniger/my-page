name: my_page
description: "My Page : gérez votre Page avec un assistant automatique."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # API GitHub + intégrité
  http: ^1.2.0
  crypto: ^3.0.3
  # stockage chiffré (Keystore) + verrouillage biométrique
  flutter_secure_storage: ^11.2.0
  local_auth: ^2.3.0
  # répertoires de cache (téléchargement des mises à jour)
  path_provider: ^2.1.4
  # sélection de médias (upload dans media/)
  file_picker: ^13.3.3
  # notifications locales (commentaires urgents, jeton)
  flutter_local_notifications: ^23.0.3

  # Firebase : identité (Auth) et données (Firestore)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0

  # Connexion de la Page (SDK natif) et chiffrement hybride du jeton
  flutter_facebook_auth: ^7.1.2
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/google.png
    - assets/images/facebook.png
    - assets/pub.pem
