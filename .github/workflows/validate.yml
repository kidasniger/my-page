name: Validation Flutter

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "assets/**"
      - "analysis_options.yaml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - name: Configuration Firebase
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_B64" || { echo "Secret GOOGLE_SERVICES_B64 manquant."; exit 1; }
          echo "$GOOGLE_SERVICES_B64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          python3 tools/gen_firebase_options.py "$RUNNER_TEMP/google-services.json" lib/firebase_options.dart

      - name: Dépendances
        run: flutter pub get
      - name: Analyse statique
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Compilation Android de validation
        run: flutter build apk --debug
