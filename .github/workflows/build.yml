name: Compiler l'APK

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: "Notes de version (sinon : message du dernier commit)"
        required: false
        default: ""
      obligatoire:
        description: "Mise à jour obligatoire"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Configuration Firebase
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          test -n "$GOOGLE_SERVICES_B64" || { echo "Secret GOOGLE_SERVICES_B64 manquant."; exit 1; }
          echo "$GOOGLE_SERVICES_B64" | base64 -d > "$RUNNER_TEMP/google-services.json"
          python3 tools/gen_firebase_options.py "$RUNNER_TEMP/google-services.json" lib/firebase_options.dart

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Tests
        run: flutter test

      - uses: gradle/actions/setup-gradle@v4

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret KEYSTORE_B64 manquant."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compiler l'APK signé
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: mypage
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_CLIENT_TOKEN: ${{ secrets.FB_CLIENT_TOKEN }}
        run: flutter build apk --release

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
          OBLIGATOIRE: ${{ github.event.inputs.obligatoire }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk my-page.apk
          sha256sum my-page.apk | cut -d' ' -f1 > my-page.apk.sha256
          if [ -z "$NOTES" ]; then NOTES="$(git log -1 --pretty=%B)"; fi
          if [ "$OBLIGATOIRE" = "true" ]; then NOTES="[obligatoire] $NOTES"; fi
          gh release create "v${{ github.run_number }}" my-page.apk my-page.apk.sha256 \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: my-page
          path: my-page.apk
