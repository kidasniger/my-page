name: Règles Firestore

on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/**'
      - 'package.json'
      - 'firebase.json'
      - '.github/workflows/rules.yml'
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Tests des règles
        run: npx firebase emulators:exec --only firestore --project demo-mypage "npm test"
